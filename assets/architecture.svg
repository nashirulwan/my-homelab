<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">High-level private homelab architecture</title>
  <desc id="desc">Home and remote clients reach a private single-node Proxmox homelab through local DNS, a reverse proxy, or Tailscale. Workloads are grouped by role and public application ingress is disabled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #94a3b8; }
      .heading { font: 700 19px system-ui, sans-serif; fill: #f8fafc; }
      .body { font: 400 15px system-ui, sans-serif; fill: #cbd5e1; }
      .small { font: 500 13px system-ui, sans-serif; fill: #94a3b8; }
      .box { stroke: #334155; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .flow { fill: none; stroke: #60a5fa; stroke-width: 3; marker-end: url(#arrow); }
      .internal { fill: none; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" rx="24"/>
  <text x="60" y="64" class="title">Private single-node homelab</text>
  <text x="60" y="94" class="subtitle">Access paths, workload roles, and shared failure boundaries</text>

  <rect x="60" y="150" width="230" height="110" class="box" fill="#1e293b"/>
  <text x="88" y="188" class="heading">Home clients</text>
  <text x="88" y="218" class="body">LAN access</text>
  <text x="88" y="242" class="small">Internal names and direct access</text>

  <rect x="60" y="350" width="230" height="110" class="box" fill="#1e293b"/>
  <text x="88" y="388" class="heading">Remote devices</text>
  <text x="88" y="418" class="body">Private overlay access</text>
  <text x="88" y="442" class="small">No public application ports</text>

  <rect x="375" y="150" width="240" height="110" class="box" fill="#164e63"/>
  <text x="403" y="188" class="heading">Local access layer</text>
  <text x="403" y="218" class="body">DNS and reverse proxy</text>
  <text x="403" y="242" class="small">Stable internal service names</text>

  <rect x="375" y="350" width="240" height="110" class="box" fill="#134e4a"/>
  <text x="403" y="388" class="heading">Tailscale</text>
  <text x="403" y="418" class="body">Authenticated remote path</text>
  <text x="403" y="442" class="small">Private network overlay</text>

  <path d="M290 205 H365" class="flow"/>
  <path d="M290 405 H365" class="flow"/>
  <path d="M615 205 H685" class="flow"/>
  <path d="M615 405 H685" class="flow"/>

  <rect x="695" y="125" width="445" height="470" class="box" fill="url(#node)"/>
  <text x="730" y="170" class="heading">Single Proxmox node</text>
  <text x="730" y="198" class="small">Unprivileged Debian LXC · local NVMe storage</text>

  <rect x="730" y="235" width="170" height="105" rx="13" fill="#1e293b" stroke="#475569"/>
  <text x="752" y="270" class="heading">Platform</text>
  <text x="752" y="299" class="body">Access, DNS, admin</text>
  <text x="752" y="322" class="small">Shared infrastructure</text>

  <rect x="930" y="235" width="170" height="105" rx="13" fill="#1e293b" stroke="#475569"/>
  <text x="952" y="270" class="heading">Observability</text>
  <text x="952" y="299" class="body">Metrics and checks</text>
  <text x="952" y="322" class="small">Internal monitoring</text>

  <rect x="730" y="375" width="170" height="105" rx="13" fill="#1e293b" stroke="#475569"/>
  <text x="752" y="410" class="heading">Data and media</text>
  <text x="752" y="439" class="body">Stateful services</text>
  <text x="752" y="462" class="small">Dedicated data volumes</text>

  <rect x="930" y="375" width="170" height="105" rx="13" fill="#1e293b" stroke="#475569"/>
  <text x="952" y="410" class="heading">Dev and personal</text>
  <text x="952" y="439" class="body">Tools and automation</text>
  <text x="952" y="462" class="small">Role-based boundaries</text>

  <path d="M900 287 H930" class="internal"/>
  <path d="M815 340 V375" class="internal"/>
  <path d="M1015 340 V375" class="internal"/>
  <path d="M900 427 H930" class="internal"/>

  <rect x="730" y="520" width="370" height="48" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="915" y="550" text-anchor="middle" class="body">Shared host, power, and primary-storage failure domain</text>

  <rect x="60" y="560" width="555" height="78" rx="14" fill="#3f1d2e" stroke="#9f1239" stroke-width="1.5"/>
  <text x="88" y="594" class="heading">Public application ingress</text>
  <text x="88" y="620" class="body">Disabled · public tunnel has no active application routes</text>

</svg>
